models:
  gemini: gemini-3.5-flash-lite
  ollama: qwen3:4b-instruct
gemini:
  thinking_level: HIGH
  retry_attempts: 8
ollama:
  url: http://localhost:11434/v1
  max_output_tokens: 4096
  timeout_s: 1800

agent:
  max_rejections: 2
  max_text_replies: 2
  max_invalid_reports: 3
  max_tool_retries: 2
  max_requests: 50
workflow:
  batch_size: 8
  max_retries: 2
  parallel_requests: 1
browser:
  settle_timeout_ms: 5000
  block_private_addresses: false
  max_content_tokens: 4000
  max_requests: 80
  screenshot_margin_px: 40

accessibility:
  skills: skills/accessibility
  prompts: prompts/accessibility
  axe_script: node_modules/axe-core/axe.min.js
  wcag_tags: [wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22aa]
  max_elements_per_rule: 10
  max_page_items: 50
  max_text_chars: 2000
  max_html_chars: 300
  max_violation_examples: 3
  max_title_headings: 5
  max_title_text_chars: 500

links:
  skills: skills/links
  prompts: prompts/links
  timeout_s: 10
  user_agent: Mozilla/5.0 (compatible; link-analyzer/0.1)
  max_page_bytes: 524288
  max_page_text_chars: 2000
  workflow_page_text_chars: 600

orchestrator:
  prompts: prompts/orchestrator
  max_requests: 150
  pages_per_call: 10
  evidence_per_call: 10
  look_per_call: 5
  max_fact_chars: 100
  max_missing_listed: 30

fleet:
  agents: agents
  # in this order in the orchestrator's prompt: soft-404, redirect and text-mismatch run in that order on a page.
  # Broken links aren't a specialist's: the orchestrator runs the link checker, a static check, itself
  specialists:
    - axe-violations
    - axe-needs-review
    - alt-text
    - link-purpose
    - page-title
    - page-language
    - heading
    - soft-404
    - redirect
    - text-mismatch
  max_requests: 150
  pages_per_call: 10
  specialist_max_requests: 6
  pages_read_per_call: 30
  max_reason_chars: 150
  max_missing_listed: 30

crawl:
  folder: crawls
  max_age_hours: 24
  max_pages: 200
  max_depth: 5
  delay_s: 0.5
  timeout_s: 10
  max_page_bytes: 1048576
  user_agent: Mozilla/5.0 (compatible; site-crawler/0.1)
  robots_agent: site-crawler
  respect_robots: true
  skip_patterns: ['log-?out', 'sign-?out', 'delete', 'remove', 'add-to-cart', 'cart/add', 'unsubscribe', '[?&]action=']
