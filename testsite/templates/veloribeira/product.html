<div class="wrap">
  <p class="breadcrumb"><a href="/shop/">Shop</a> › {{name}}</p>
  <article class="product">
    <img src="/static/img/products/{{slug}}.png" alt="{{name}}" width="600" height="400">
    <div>
      <h1>{{name}}</h1>
      <p class="price">{{price}}</p>
      <p class="stock {{stock_class}}">{{stock}}</p>
      <p>{{summary}}</p>
      <h2>Specifications</h2>
      <ul>{{specs}}</ul>
      <p><a class="button" href="/contact">{{cta}}</a></p>
    </div>
  </article>
</div>
