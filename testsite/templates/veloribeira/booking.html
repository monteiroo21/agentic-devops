<div class="wrap prose">
  <h1>Book online</h1>
  <p>Choose a rental or a tour and a date, and we'll confirm by email within a few hours.</p>
  <form>
    <label for="what">What would you like to book?</label>
    <select id="what" name="what">
      <option>City bike rental</option>
      <option>E-bike rental</option>
      <option>Touring bike rental</option>
      <option>Coastal ride to Vila do Conde</option>
      <option>Gerês national park weekend</option>
    </select>
    <label for="date">Date</label>
    <input id="date" name="date" type="date">
    <label for="riders">Riders</label>
    <input id="riders" name="riders" type="number" min="1" max="8" value="2">
    <p><button class="button" type="submit">Check availability</button></p>
  </form>
</div>
